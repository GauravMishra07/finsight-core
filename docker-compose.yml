version: '3.8'

# Frontend (finsight-web/) is a static Next.js export: run it with `npm run dev` or deploy to Vercel.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - .env  # Injects your Groq/Pinecone API keys into the backend
