version: '3.8'

services:
  redis:
    image: redis/redis-stack-server:latest
    container_name: finsight-redis
    ports:
      - "6379:6379"
    volumes:
      - finsight_redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  finsight_redis_data:
    driver: local